<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOLLER PMT Spectral Characterization</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.27.0/plotly.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;800&display=swap');

  :root {
    --bg:       #0d1117;
    --surface:  #161b22;
    --border:   #30363d;
    --accent:   #58a6ff;
    --accent2:  #f78166;
    --text:     #e6edf3;
    --muted:    #8b949e;
    --navy:     #0C447C;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
  }

  header {
    padding: 24px 32px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
  }
  header .logo {
    width: 36px; height: 36px;
    background: var(--accent);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 800;
    color: #000;
    flex-shrink: 0;
  }
  header h1 { font-size: 1.15rem; font-weight: 800; letter-spacing: -0.02em; }
  header p  { font-size: 0.72rem; color: var(--muted); font-family: 'JetBrains Mono', monospace; margin-top: 2px; }

  .layout {
    display: grid;
    grid-template-columns: 260px 1fr;
    min-height: calc(100vh - 73px);
  }

  /* SIDEBAR */
  aside {
    border-right: 1px solid var(--border);
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .section-label {
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    margin-bottom: 8px;
  }

  .pmt-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }

  .pmt-btn {
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .pmt-btn::before {
    content: '';
    position: absolute; left: 0; top: 0;
    width: 3px; height: 100%;
    background: transparent;
    transition: background 0.15s;
  }
  .pmt-btn.active {
    color: var(--text);
    border-color: currentColor;
  }
  .pmt-btn.active::before { background: currentColor; }
  .pmt-btn:hover { background: #1f2937; color: var(--text); }

  .select-row {
    display: flex; gap: 6px;
  }
  .select-row button {
    flex: 1;
    padding: 5px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 5px;
    font-size: 0.65rem;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    transition: all 0.15s;
  }
  .select-row button:hover { color: var(--text); border-color: var(--accent); }

  .control-group { display: flex; flex-direction: column; gap: 8px; }

  .radio-group { display: flex; flex-direction: column; gap: 5px; }
  .radio-group label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.78rem;
    cursor: pointer;
    padding: 5px 8px;
    border-radius: 6px;
    transition: background 0.1s;
  }
  .radio-group label:hover { background: var(--surface); }
  .radio-group input { accent-color: var(--accent); cursor: pointer; }

  .toggle-group { display: flex; flex-direction: column; gap: 5px; }
  .toggle-group label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.78rem;
    cursor: pointer;
    padding: 5px 8px;
    border-radius: 6px;
    transition: background 0.1s;
  }
  .toggle-group label:hover { background: var(--surface); }
  .toggle-group input { accent-color: var(--accent); cursor: pointer; }

  /* MAIN */
  main {
    display: flex;
    flex-direction: column;
    padding: 24px;
    gap: 24px;
    overflow: auto;
  }

  .chart-tabs {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 0;
  }
  .tab-btn {
    padding: 8px 20px;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--muted);
    font-family: 'Syne', sans-serif;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    margin-bottom: -1px;
  }
  .tab-btn.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  .tab-btn:hover { color: var(--text); }

  .charts-container {
    display: grid;
    gap: 20px;
  }
  .charts-container.split { grid-template-columns: 1fr 1fr; }
  .charts-container.single { grid-template-columns: 1fr; }

  .chart-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .chart-card h3 {
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    font-family: 'JetBrains Mono', monospace;
  }
  .chart-wrapper {
    position: relative;
    height: 340px;
  }
  .chart-wrapper.tall { height: 460px; }
  .plotly-wrapper { height: 460px; width: 100%; }

  .heatmap-wrapper {
    overflow-x: auto;
  }
  .heatmap-table {
    width: 100%;
    border-collapse: collapse;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
  }
  .heatmap-table th {
    padding: 6px 10px;
    background: var(--bg);
    color: var(--muted);
    text-align: center;
    border: 1px solid var(--border);
    white-space: nowrap;
    font-weight: 600;
  }
  .heatmap-table td {
    padding: 5px 8px;
    text-align: center;
    border: 1px solid #1f2937;
    font-size: 0.65rem;
    font-weight: 600;
    transition: opacity 0.2s;
    cursor: default;
    position: relative;
  }
  .heatmap-table td:hover { opacity: 0.85; outline: 1px solid rgba(255,255,255,0.3); }

  .stats-bar {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .stat-chip {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
  }
  .stat-chip span { color: var(--accent); font-weight: 600; }

  .legend-bar {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .legend-dot {
    width: 10px; height: 10px;
    border-radius: 2px;
    flex-shrink: 0;
  }

  .heatmap-scale {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    color: var(--muted);
    margin-top: 8px;
  }
  .scale-bar {
    height: 10px;
    width: 160px;
    border-radius: 3px;
    background: linear-gradient(to right, #0d1117, #58a6ff);
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>MOLLER PMT Spectral Characterization</h1>
    <p>Photodiode Method · 11 PMTs · 230–510 nm</p>
  </div>
</header>

<div class="layout">
  <aside>
    <div>
      <div class="section-label">PMT Selection</div>
      <div class="select-row" style="margin-bottom:8px">
        <button onclick="selectAll()">All</button>
        <button onclick="selectNone()">None</button>
      </div>
      <div class="pmt-grid" id="pmtGrid"></div>
    </div>

    <div>
      <div class="section-label">Y Axis</div>
      <div class="radio-group" id="yAxisGroup">
        <label><input type="radio" name="yaxis" value="S_mean" checked> S(C) Mean</label>
        <label><input type="radio" name="yaxis" value="Ic_mean"> I_cathode (nA)</label>
        <label><input type="radio" name="yaxis" value="P_mean"> P_PD (nW)</label>
        <label><input type="radio" name="yaxis" value="dS_full"> δS Full</label>
        <label><input type="radio" name="yaxis" value="S_stat"> S(C) Stat Unc</label>
      </div>
    </div>

    <div>
      <div class="section-label">Error Bars</div>
      <div class="toggle-group">
        <label><input type="checkbox" id="errY" checked> Vertical (δS Full)</label>
        <label><input type="checkbox" id="errX" checked> Horizontal (δλ)</label>
      </div>
    </div>
  </aside>

  <main>
    <div class="chart-tabs">
      <button class="tab-btn active" onclick="setView('line')">Line Plot</button>
      <button class="tab-btn" onclick="setView('heatmap')">Heatmap</button>
    </div>

    <div id="statsBar" class="stats-bar"></div>

    <div id="chartsContainer" class="charts-container single">
      <!-- dynamically filled -->
    </div>
  </main>
</div>

  'F23-586': '#58a6ff', 'F23-619': '#ff7b72', 'B24-1117': '#3fb950',
  'B24-1155': '#d2a8ff', 'E24-1227': '#ffa657', 'G24-1121': '#79c0ff',

  'D24-1199': '#ff6e96', 'F24-1247': '#a5d6ff'
};

const PMTS = Object.keys(RAW);
const Y_LABELS = {
  S_mean:  'S(C)',
  Ic_mean: 'I_cathode (nA)',
  P_mean:  'P_PD (nW)',
  dS_full: 'δS Full',
  S_stat:  'S(C) Stat Unc'
};
const Y_ERR = { S_mean: 'dS_full', Ic_mean: 'Ic_std', P_mean: 'P_std', dS_full: null, S_stat: null };

let selected = new Set(PMTS);
let currentView = 'line';

// ── PMT buttons ────────────────────────────────────────────────────────
function buildPMTGrid() {
  const grid = document.getElementById('pmtGrid');
  PMTS.forEach(pmt => {
    const btn = document.createElement('button');
    btn.className = 'pmt-btn active';
    btn.textContent = pmt;
    btn.style.color = PMT_COLORS[pmt];
    btn.style.borderColor = PMT_COLORS[pmt] + '44';
    btn.dataset.pmt = pmt;
    btn.onclick = () => togglePMT(pmt, btn);
    grid.appendChild(btn);
  });
}

function togglePMT(pmt, btn) {
  if (selected.has(pmt)) {
    selected.delete(pmt);
    btn.classList.remove('active');
  } else {
    selected.add(pmt);
    btn.classList.add('active');
  }
  render();
}

function selectAll()  { PMTS.forEach(p => selected.add(p)); document.querySelectorAll('.pmt-btn').forEach(b => b.classList.add('active')); render(); }
function selectNone() { selected.clear(); document.querySelectorAll('.pmt-btn').forEach(b => b.classList.remove('active')); render(); }

// ── Controls ───────────────────────────────────────────────────────────
document.querySelectorAll('input[name="yaxis"]').forEach(r => r.addEventListener('change', render));
document.getElementById('errY').addEventListener('change', render);
document.getElementById('errX').addEventListener('change', render);

function getYKey() { return document.querySelector('input[name="yaxis"]:checked').value; }
function getErrY() { return document.getElementById('errY').checked; }
function getErrX() { return document.getElementById('errX').checked; }

function setView(v) {
  currentView = v;
  document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.toggle('active', ['line','heatmap'][i] === v));
  render();
}

// ── Stats bar ──────────────────────────────────────────────────────────
function updateStats() {
  const yKey = getYKey();
  const bar = document.getElementById('statsBar');
  if (selected.size === 0) { bar.innerHTML = ''; return; }

  let bestPMT = '', bestVal = -Infinity;
  selected.forEach(pmt => {
    const pts = RAW[pmt];
    const maxV = Math.max(...pts.map(d => d[yKey]));
    if (maxV > bestVal) { bestVal = maxV; bestPMT = pmt; }
  });

  bar.innerHTML = `
    <div class="stat-chip">PMTs shown: <span>${selected.size}</span></div>
    <div class="stat-chip">Metric: <span>${Y_LABELS[yKey]}</span></div>
    <div class="stat-chip">Peak PMT: <span style="color:${PMT_COLORS[bestPMT]}">${bestPMT}</span></div>
  `;
}

// ── Line chart (Plotly) ────────────────────────────────────────────────
function buildLineChart(divId) {
  const yKey  = getYKey();
  const showErrY = getErrY();
  const showErrX = getErrX();
  const errYKey  = Y_ERR[yKey];

  const traces = [];
  selected.forEach(pmt => {
    const pts = RAW[pmt];
    const color = PMT_COLORS[pmt];
    const xs  = pts.map(d => d.wv);
    const ys  = pts.map(d => d[yKey]);
    const eys = errYKey ? pts.map(d => d[errYKey]) : null;
    const exs = pts.map(d => d.dlam);

    traces.push({
      x: xs, y: ys,
      name: pmt,
      mode: 'lines+markers',
      type: 'scatter',
      line:   { color, width: 1.5 },
      marker: { color, size: 3 },
      error_y: showErrY && eys ? {
        type: 'data', array: eys, visible: true,
        color: color, thickness: 1.2, width: 3
      } : { visible: false },
      error_x: showErrX ? {
        type: 'data', array: exs, visible: true,
        color: color, thickness: 1.2, width: 3
      } : { visible: false },
      hovertemplate: `<b>${pmt}</b><br>λ = %{x} nm<br>${Y_LABELS[yKey]} = %{y:.3e}<extra></extra>`
    });
  });

  const layout = {
    paper_bgcolor: 'rgba(0,0,0,0)',
    plot_bgcolor:  'rgba(0,0,0,0)',
    font: { color: '#8b949e', family: 'JetBrains Mono, monospace', size: 11 },
    xaxis: {
      title: { text: 'Wavelength λ (nm)', font: { size: 12, color: '#8b949e' } },
      tickmode: 'array',
      tickvals: [230,250,270,290,310,330,350,370,390,410,430,450,470,490,510],
      gridcolor: '#21262d', zerolinecolor: '#21262d',
      color: '#8b949e'
    },
    yaxis: {
      title: { text: Y_LABELS[yKey], font: { size: 12, color: '#8b949e' } },
      tickformat: '.2e',
      gridcolor: '#21262d', zerolinecolor: '#21262d',
      color: '#8b949e'
    },
    legend: { font: { size: 10 }, bgcolor: 'rgba(0,0,0,0)', x: 0.01, y: 0.99 },
    margin: { l: 70, r: 20, t: 20, b: 60 },
    hovermode: 'closest'
  };

  Plotly.newPlot(divId, traces, layout, { responsive: true, displayModeBar: false });
}

// ── Heatmap ────────────────────────────────────────────────────────────
function buildHeatmap(containerId) {
  const yKey = getYKey();
  const container = document.getElementById(containerId);

  const activePMTs = PMTS.filter(p => selected.has(p));
  if (activePMTs.length === 0) { container.innerHTML = '<p style="color:var(--muted);padding:20px">No PMTs selected.</p>'; return; }

  // Collect all wavelengths
  const wvSet = new Set();
  activePMTs.forEach(p => RAW[p].forEach(d => wvSet.add(d.wv)));
  const wvs = [...wvSet].sort((a,b)=>a-b);

  // Build value matrix
  const matrix = {};
  activePMTs.forEach(p => {
    matrix[p] = {};
    RAW[p].forEach(d => { matrix[p][d.wv] = d[yKey]; });
  });

  // Global min/max for color scale
  let gMin = Infinity, gMax = -Infinity;
  activePMTs.forEach(p => wvs.forEach(w => {
    const v = matrix[p][w];
    if (v !== undefined) { gMin = Math.min(gMin, v); gMax = Math.max(gMax, v); }
  }));

  function getColor(v) {
    if (v === undefined) return '#1f2937';
    const t = (v - gMin) / (gMax - gMin);
    // Deep navy → bright blue → cyan
    const r = Math.round(13 + t * (0 - 13));
    const g = Math.round(17 + t * (200 - 17));
    const b = Math.round(23 + t * (255 - 23));
    return `rgb(${r},${g},${b})`;
  }

  function textColor(v) {
    if (v === undefined) return '#4b5563';
    const t = (v - gMin) / (gMax - gMin);
    return t > 0.55 ? '#000' : '#e6edf3';
  }

  let html = `<div class="heatmap-wrapper"><table class="heatmap-table"><thead><tr>
    <th>PMT \\ λ (nm)</th>`;
  wvs.forEach(w => { html += `<th>${w}</th>`; });
  html += `</tr></thead><tbody>`;

  activePMTs.forEach(p => {
    html += `<tr><th style="text-align:left;color:${PMT_COLORS[p]}">${p}</th>`;
    wvs.forEach(w => {
      const v = matrix[p][w];
      const bg = getColor(v);
      const tc = textColor(v);
      const label = v !== undefined ? v.toExponential(1) : '—';
      html += `<td style="background:${bg};color:${tc}" title="${p} @ ${w}nm = ${v !== undefined ? v.toExponential(3) : 'N/A'}">${label}</td>`;
    });
    html += `</tr>`;
  });

  html += `</tbody></table></div>
  <div class="heatmap-scale">
    <span>${gMin.toExponential(1)}</span>
    <div class="scale-bar"></div>
    <span>${gMax.toExponential(1)}</span>
    <span style="margin-left:8px">${Y_LABELS[yKey]}</span>
  </div>`;

  container.innerHTML = html;
}

// ── Legend ─────────────────────────────────────────────────────────────
function buildLegend(containerId) {
  const container = document.getElementById(containerId);
  let html = '<div class="legend-bar">';
  PMTS.filter(p => selected.has(p)).forEach(p => {
    html += `<div class="legend-item"><div class="legend-dot" style="background:${PMT_COLORS[p]}"></div><span style="color:${PMT_COLORS[p]}">${p}</span></div>`;
  });
  html += '</div>';
  container.innerHTML = html;
}

// ── Main render ────────────────────────────────────────────────────────
function render() {
  updateStats();

  const cc = document.getElementById('chartsContainer');
  cc.innerHTML = '';
  cc.className = 'charts-container';

  if (currentView === 'line') {
    cc.classList.add('single');
    cc.innerHTML = `
      <div class="chart-card">
        <h3>${Y_LABELS[getYKey()]} vs λ</h3>
        <div id="lineDiv" class="plotly-wrapper"></div>
      </div>`;
    buildLineChart('lineDiv');

  } else {
    cc.classList.add('single');
    cc.innerHTML = `
      <div class="chart-card">
        <h3>Heatmap — ${Y_LABELS[getYKey()]}</h3>
        <div id="heatmapBody"></div>
      </div>`;
    buildHeatmap('heatmapBody');
  }
}

buildPMTGrid();
render();
</script>
